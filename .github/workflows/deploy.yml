# Push main → test → build → migrate D1 → đồng bộ secrets → deploy lên Cloudflare Workers.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Gắn D1 database_id
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.D1_DATABASE_ID }}/" wrangler.jsonc
      - name: Gắn APP_ORIGIN
        if: ${{ vars.APP_ORIGIN != '' }}
        run: sed -i "s#https://ai-lanh-nghe-app.workers.dev#${{ vars.APP_ORIGIN }}#" wrangler.jsonc
      - run: npm run build
      - name: Migrate D1
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        run: npx wrangler deploy
      - name: Đồng bộ secrets (không in ra log)
        env:
          KEY_ENC_SECRET: ${{ secrets.KEY_ENC_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TRIAL_API_KEY: ${{ secrets.TRIAL_API_KEY }}
        run: |
          node -e 'const o={};for(const k of ["KEY_ENC_SECRET","SESSION_SECRET","RESEND_API_KEY","TRIAL_API_KEY"]) if(process.env[k]) o[k]=process.env[k]; require("fs").writeFileSync("/tmp/s.json", JSON.stringify(o))'
          npx wrangler secret bulk /tmp/s.json --name ai-lanh-nghe-app
          rm -f /tmp/s.json
