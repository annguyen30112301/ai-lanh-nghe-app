# Push main → test → build → migrate D1 → đồng bộ secrets → deploy lên Cloudflare Workers.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Chọn nhà cung cấp + mô hình cho lượt dùng thử
        # Khách tự chọn mô hình của mình; chỉ 5 lượt thử (key của nhóm) dùng TRIAL_MODEL.
        # OPENROUTER_MODEL cũ vẫn được nhận làm TRIAL_MODEL để không đổi hành vi bản đang chạy.
        env:
          TP: ${{ vars.TRIAL_PROVIDER || secrets.TRIAL_PROVIDER }}
          TM: ${{ vars.TRIAL_MODEL || secrets.TRIAL_MODEL }}
          TF: ${{ vars.TRIAL_FALLBACK_MODEL || secrets.TRIAL_FALLBACK_MODEL }}
          OM: ${{ vars.OPENROUTER_MODEL || secrets.OPENROUTER_MODEL }}
        run: |
          if [ -z "$TM" ]; then
            if [ "$TP" = "gemini" ]; then TM="gemini-3.8-flash"; TF="${TF:-gemini-3.7-flash}"; elif [ -n "$OM" ]; then TM="$OM"; fi
          fi
          if [ -n "$TP" ]; then sed -i "s#\"TRIAL_PROVIDER\": \"[^\"]*\"#\"TRIAL_PROVIDER\": \"$TP\"#" wrangler.jsonc; fi
          if [ -n "$TM" ]; then sed -i "s#\"TRIAL_MODEL\": \"[^\"]*\"#\"TRIAL_MODEL\": \"$TM\"#" wrangler.jsonc; fi
          if [ -n "$TF" ]; then sed -i "s#\"TRIAL_FALLBACK_MODEL\": \"[^\"]*\"#\"TRIAL_FALLBACK_MODEL\": \"$TF\"#" wrangler.jsonc; fi
          grep -E "TRIAL_PROVIDER|TRIAL_MODEL|TRIAL_FALLBACK_MODEL" wrangler.jsonc
      - run: npm run build
      - name: Migrate D1
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        run: npx wrangler deploy
      - name: Đồng bộ secrets (không in ra log)
        env:
          KEY_ENC_SECRET: ${{ secrets.KEY_ENC_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TRIAL_API_KEY: ${{ secrets.TRIAL_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
        run: |
          node -e 'const o={};for(const k of ["KEY_ENC_SECRET","SESSION_SECRET","RESEND_API_KEY","TRIAL_API_KEY","SMTP_USER","SMTP_PASS"]) if(process.env[k]) o[k]=process.env[k]; require("fs").writeFileSync("/tmp/s.json", JSON.stringify(o))'
          npx wrangler secret bulk /tmp/s.json --name ai-lanh-nghe-app
          rm -f /tmp/s.json
