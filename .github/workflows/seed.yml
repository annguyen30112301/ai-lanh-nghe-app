# Bấm tay: tạo lại dữ liệu mẫu (mốc thời gian tính từ hôm nay) và nạp vào D1 thật.
# CẢNH BÁO: xóa toàn bộ bảng runs (lượt chạy) rồi nạp lại "Cơ khí Tân Phú".
name: Nạp dữ liệu mẫu
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ XOA-VA-NAP để xác nhận xóa lượt chạy cũ và nạp dữ liệu mẫu"
        required: true
jobs:
  seed:
    if: ${{ inputs.confirm == 'XOA-VA-NAP' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/make-seed.mjs
      - run: npx -y wrangler@4 d1 execute DB --remote --file=db/seed.sql --yes
